services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:18-alpine
    container_name: sstewartii-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sstewarti

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - app-network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sstewarti']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sstewartii-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - root

    volumes:
      - redis-data:/data

    networks:
      - app-network

    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a root ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================
  # Backend
  # ============================================================
  backend:
    image: ghcr.io/backbencherstudio/sstewartii_backend:latest
    container_name: sstewartii-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - app-network

    volumes:
      - backend-uploads:/app/uploads

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/v1/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sstewartii-prometheus
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

    networks:
      - app-network

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:12.1.1
    container_name: sstewartii-grafana
    restart: unless-stopped

    depends_on:
      prometheus:
        condition: service_started

    volumes:
      - grafana-data:/var/lib/grafana

    ports:
      - '3001:3000'

    networks:
      - app-network

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:
  postgres-data:
    name: sstewartii-postgres-data

  redis-data:
    name: sstewartii-redis-data

  backend-uploads:
    name: sstewartii-backend-uploads

  prometheus-data:
    name: sstewartii-prometheus-data

  grafana-data:
    name: sstewartii-grafana-data

# ==============================================================
# Network
# ==============================================================
networks:
  app-network:
    name: sstewartii-network
    driver: bridge
